name: Release

on:
  workflow_dispatch:
  workflow_call:

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        run: npm run build

      - name: Run Tests
        run: npm run test

      # TEMPORARY: NODE_AUTH_TOKEN bootstraps the first-ever publish of
      # @gjuta/oagen. Trusted Publishing (OIDC, no stored token) can only be
      # configured on the package's own npm settings page once the package
      # exists on the registry -- chicken-and-egg for a brand new scope. Once
      # this first publish succeeds and Trusted Publishing is configured for
      # this repo+workflow, remove this env block and the NPM_TOKEN secret;
      # `id-token: write` above is already sufficient for OIDC-only publishing
      # after that, matching how this workflow was originally written upstream.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag latest --access public --provenance
